<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Two ways the taste profile avoids being swamped. Left: a liked song's weight halves each year. Right: an artist's total weight grows with the square root of the number of liked songs, so one prolific artist cannot dominate." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Two ways the taste profile avoids being swamped</title><desc>Left: a liked song's weight halves each year. Right: an artist's total weight grows with the square root of the number of liked songs, so one prolific artist cannot dominate.</desc><rect x="0.5" y="0.5" width="959" height="419" rx="10" fill="#fcfcfb" stroke="#d9d8d2"/><text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700">Two ways the taste profile avoids being swamped</text><text x="24.0" y="54.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Both are simple curves, shown here exactly as the program computes them.</text><text x="24.0" y="84.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700">1. Older likes count a little less</text><text x="24.0" y="102.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Weight of a liked song by its age (half-life: 1 year)</text><line x1="64.0" y1="332.0" x2="424.0" y2="332.0" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="58.0" y="336.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">0</text><line x1="64.0" y1="284.4" x2="424.0" y2="284.4" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="58.0" y="288.4" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">0.25</text><line x1="64.0" y1="236.8" x2="424.0" y2="236.8" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="58.0" y="240.8" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">0.5</text><line x1="64.0" y1="189.1" x2="424.0" y2="189.1" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="58.0" y="193.1" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">0.75</text><line x1="64.0" y1="141.5" x2="424.0" y2="141.5" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="58.0" y="145.5" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">1</text><line x1="64.0" y1="332.0" x2="64.0" y2="337.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="64.0" y="350.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">new</text><line x1="184.0" y1="332.0" x2="184.0" y2="337.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="184.0" y="350.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">1 yr</text><line x1="304.0" y1="332.0" x2="304.0" y2="337.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="304.0" y="350.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">2 yr</text><line x1="424.0" y1="332.0" x2="424.0" y2="337.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="424.0" y="350.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">3 yr</text><line x1="64.0" y1="332.0" x2="424.0" y2="332.0" stroke="#8a897f" stroke-width="1.2" stroke-linecap="butt"/><line x1="64.0" y1="132.0" x2="64.0" y2="332.0" stroke="#8a897f" stroke-width="1.2" stroke-linecap="butt"/><text x="244.0" y="368.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">age of the like</text><polyline points="64.0,141.5 70.0,148.0 76.0,154.3 82.0,160.3 88.0,166.2 94.0,171.8 100.0,177.3 106.0,182.6 112.0,187.6 118.0,192.6 124.0,197.3 130.0,201.9 136.0,206.3 142.0,210.6 148.0,214.7 154.0,218.7 160.0,222.6 166.0,226.3 172.0,229.9 178.0,233.4 184.0,236.8 190.0,240.0 196.0,243.1 202.0,246.2 208.0,249.1 214.0,251.9 220.0,254.6 226.0,257.3 232.0,259.8 238.0,262