<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Matching one song across services. A Spotify link is converted to an ISRC recording code, then to a MusicBrainz recording ID and artist ID. About 79 percent of the songs in the library matched." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Matching one song across services</title><desc>A Spotify link is converted to an ISRC recording code, then to a MusicBrainz recording ID and artist ID. About 79 percent of the songs in the library matched.</desc><rect x="0.5" y="0.5" width="959" height="359" rx="10" fill="#fcfcfb" stroke="#d9d8d2"/><text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700">Matching one song across services</text><text x="24.0" y="54.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Spotify, MusicBrainz and ListenBrainz label songs differently. A recording code is the bridge.</text><rect x="20.0" y="90.0" width="155.0" height="100.0" rx="10" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1"/><text x="97.0" y="118.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700">Spotify link</text><text x="97.0" y="145.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="normal">spotify:track:...</text><text x="97.0" y="170.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">Spotify's own label</text><rect x="275.0" y="90.0" width="155.0" height="100.0" rx="10" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="352.0" y="118.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700">ISRC code</text><text x="352.0" y="145.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="normal">QZ5C81600003</text><text x="352.0" y="170.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">Barcode of a recording</text><rect x="530.0" y="90.0" width="155.0" height="100.0" rx="10" fill="#d7f1e6" stroke="#1baf7a" stroke-width="1"/><text x="607.0" y="118.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700">Recording ID</text><text x="607.0" y="145.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="normal">d90934be-302a-...</text><text x="607.0" y="170.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">MusicBrainz label (MBID)</text><rect x="785.0" y="90.0" width="155.0" height="100.0" rx="10" fill="#d7f1e6" stroke="#1baf7a" stroke-width="1"/><text x="862.0" y="118.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700">Artist ID</text><text x="862.0" y="145.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="normal">e520459c-dff4-...</text><text x="862.0" y="170.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">Who made it (MBID)</text><line x1="178.0" y1="145.0" x2="264.0" y2="145.0" stroke="#52514e" stroke-width="1.8" stroke-linecap="butt"/><polygon points="272.0,145.0 264.0,149.0 264.0,141.0" fill="#52514e"/><text x="225.0" y="128.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">one Spotify</text><text x="225.0" y="140.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">lookup</text><line x1="433.0" y1="145.0" x2="519.0" y2="145.0" stroke="#52514e" stroke-width="1.8" stroke-linecap="butt"/><polygon points="527.0,145.0 519.0,149.0 519.0,141.0" fill="#52514e"/><text x="480.0" y="128.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">search</text><text x="480.0" y="140.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">MusicBrainz</text><line x1="688.0" y1="145.0" x2="774.0" y2="145.0" stroke="#52514e" stroke-width="1.8" stroke-linecap="butt"/><polygon points="782.0,145.0 774.0,149.0 774.0,141.0" fill="#52514e"/><text x="735.0" y="128.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">read the</text><text x="735.0" y="140.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">credits</text><text x="24.0" y="235.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">How many songs matched (172 songs in the library):</text><rect x="24.0" y="250.0" width="700.0" height="26.0" rx="4" fill="#fbe3d9" stroke="#eb6834" stroke-width="1"/><rect x="24.0" y="250.0" width="553.5" height="26.0" rx="4" fill="#1baf7a"/><text x="300.7" y="268.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">136 matched (79%)</text><text x="650.7" y="268.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">36 not found</text><text x="24.0" y="308.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Unmatched songs are not used as starting points for finding new music. This is why the candidate pool is smaller than the library.</text><text x="24.0" y="330.0" font-size="11.5" fill="#8a897f" text-anchor="start" font-weight="normal">The codes shown are examples. Coverage depends on how well MusicBrainz knows each recording.</text></svg>
