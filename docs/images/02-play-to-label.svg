<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="How one play becomes a like or a dislike. A 200 second song with six example plays. Skipping early is a stronger dislike than skipping late. Finishing is a like. Stopping mid-song counts as nothing." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>How one play becomes a like or a dislike</title><desc>A 200 second song with six example plays. Skipping early is a stronger dislike than skipping late. Finishing is a like. Stopping mid-song counts as nothing.</desc><rect x="0.5" y="0.5" width="959" height="469" rx="10" fill="#fcfcfb" stroke="#d9d8d2"/><text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700">How one play becomes a like or a dislike</text><text x="24.0" y="54.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Example song: 200 seconds long. Bars show how far each play got.</text><rect x="230.0" y="100.0" width="26.0" height="276.0" rx="0" fill="#eb6834" opacity="0.55"/><rect x="256.0" y="100.0" width="52.0" height="276.0" rx="0" fill="#eb6834" opacity="0.33"/><rect x="308.0" y="100.0" width="390.0" height="276.0" rx="0" fill="#eb6834" opacity="0.14"/><rect x="698.0" y="100.0" width="52.0" height="276.0" rx="0" fill="#2a78d6" opacity="0.28"/><line x1="230.0" y1="92.0" x2="230.0" y2="376.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 3"/><text x="226.0" y="86.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">0 s</text><line x1="256.0" y1="92.0" x2="256.0" y2="376.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 3"/><text x="256.0" y="86.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">10 s</text><line x1="308.0" y1="92.0" x2="308.0" y2="376.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 3"/><text x="308.0" y="86.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">30 s</text><line x1="698.0" y1="92.0" x2="698.0" y2="376.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 3"/><text x="698.0" y="86.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">90% = 180 s</text><line x1="750.0" y1="92.0" x2="750.0" y2="376.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 3"/><text x="750.0" y="86.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">end</text><text x="20.0" y="133.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">Skipped at 4 s</text><rect x="230.0" y="122.0" width="520.0" height="14.0" rx="3" fill="#ffffff" stroke="#d9d8d2" stroke-width="1"/><rect x="230.0" y="122.0" width="10.4" height="14.0" rx="3" fill="#eb6834"/><line x1="247.4" y1="124.0" x2="257.4" y2="134.0" stroke="#eb6834" stroke-width="2.2" stroke-linecap="round"/><line x1="247.4" y1="134.0" x2="257.4" y2="124.0" stroke="#eb6834" stroke-width="2.2" stroke-linecap="round"/><text x="770.0" y="134.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Strong dislike  (-1.0)</text><text x="20.0" y="177.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">Skipped at 20 s</text><rect x="230.0" y="166.0" width="520.0" height="14.0" rx="3" fill="#ffffff" stroke="#d9d8d2" stroke-width="1"/><rect x="230.0" y="166.0" width="52.0" height="14.0" rx="3" fill="#eb6834"/><line x1="289.0" y1="168.0" x2="299.0" y2="178.0" stroke="#eb6834" stroke-width="2.2" stroke-linecap="round"/><line x1="289.0" y1="178.0" x2="299.0" y2="168.0" stroke="#eb6834" stroke-width="2.2" stroke-linecap="round"/><text x="770.0" y="178.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Dislike  (-0.6)</text><text x="20.0" y="221.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">Skipped at 2:00</text><rect x="230.0" y="210.0" width="520.0" height="14.0" rx="3" fill="#ffffff" stroke="#d9d8d2" stroke-width="1"/><rect x="230.0" y="210.0" width="312.0" height="14.0" rx="3" fill="#eb6834"/><line x1="549.0" y1="212.0" x2="559.0" y2="222.0" stroke="#eb6834" stroke-width="2.2" stroke-linecap="round"/><line x1="549.0" y1="222.0" x2="559.0" y2="212.0" stroke="#eb6834" stroke-width="2.2" stroke-linecap="round"/><text x="770.0" y="222.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Mild dislike  (-0.3)</text><text x="20.0" y="265.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">Played to the end</text><rect x="230.0" y="254.0" width="520.0" height="14.0" rx="3" fill="#ffffff" stroke="#d9d8d2" stroke-width="1"/><rect x="230.0" y="254.0" width="520.0" height="14.0" rx="3" fill="#2a78d6"/><polyline points="731.0,261.0 734.5,264.5 741.0,257.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="770.0" y="266.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Mild like  (+0.4)</text><text x="20.0" y="309.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">Finished, then saved or replayed</text><rect x="230.0" y="298.0" width="520.0" height="14.0" rx="3" fill="#ffffff" stroke="#d9d8d2" stroke-width="1"/><rect x="230.0" y="298.0" width="520.0" height="14.0" rx="3" fill="#2a78d6"/><polyline points="731.0,305.0 734.5,308.5 741.0,301.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="770.0" y="310.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Strong like  (+1.0)</text><text x="20.0" y="353.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">Stopped at 1:30 (app closed)</text><rect x="230.0" y="342.0" width="520.0" height="14.0" rx="3" fill="#ffffff" stroke="#d9d8d2" stroke-width="1"/><rect x="230.0" y="342.0" width="234.0" height="14.0" rx="3" fill="#8a897f"/><rect x="470.0" y="344.0" width="4.0" height="10.0" rx="0" fill="#8a897f"/><rect x="477.0" y="344.0" width="4.0" height="10.0" rx="0" fill="#8a897f"/><text x="770.0" y="354.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Ignored  (no evidence)</text><text x="24.0" y="446.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Thresholds: under 10 s is a strong dislike, 10 to 30 s a dislike, a later skip a mild one. Finished means 90% or more of the song.</text></svg>
