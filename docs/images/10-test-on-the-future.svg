<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Testing on the future, not on a shuffle. Top: a random split lets the model train on plays that happened after the ones it is tested on. Bottom: a rolling split always trains on the past and tests on what came next, with a small gap." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Testing on the future, not on a shuffle</title><desc>Top: a random split lets the model train on plays that happened after the ones it is tested on. Bottom: a rolling split always trains on the past and tests on what came next, with a small gap.</desc><rect x="0.5" y="0.5" width="959" height="439" rx="10" fill="#fcfcfb" stroke="#d9d8d2"/><text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700">Testing on the future, not on a shuffle</text><text x="24.0" y="54.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Each square is one day of listening. Time runs left to right.</text><text x="24.0" y="88.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="700">Random split (misleading)</text><rect x="130.0" y="100.0" width="25.0" height="30.0" rx="4" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1"/><rect x="158.0" y="100.0" width="25.0" height="30.0" rx="4" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1"/><rect x="186.0" y="100.0" width="25.0" height="30.0" rx="4" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1"/><rect x="214.0" y="100.0" width="25.0" height="30.0" rx="4" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1"/><rect x="242.0" y="100.0" width="25.0" height="30.0" rx="4" fill="#fbe3d9" stroke="#eb6834" stroke-width="2"/><text x="254.0" y="120.0" font-size="11" fill="#eb6834" text-anchor="middle" font-weight="700">T</text><rect x="270.0" y="100.0" width="25.0" height="30.0" rx="4" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1"/><rect x="298.0" y="100.0" width="25.0