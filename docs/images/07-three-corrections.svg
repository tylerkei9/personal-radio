<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Three corrections applied to every candidate. Three small charts: the two-way factor by rank, breadth damping that grows with the square root of the number of seeds, and the popularity multiplier on a log scale for ordinary and deep-cut songs." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Three corrections applied to every candidate</title><desc>Three small charts: the two-way factor by rank, breadth damping that grows with the square root of the number of seeds, and the popularity multiplier on a log scale for ordinary and deep-cut songs.</desc><rect x="0.5" y="0.5" width="959" height="419" rx="10" fill="#fcfcfb" stroke="#d9d8d2"/><text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700">Three corrections applied to every candidate</text><text x="24.0" y="54.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Each one lowers the score of a song that looks similar only because it is everywhere.</text><text x="24.0" y="84.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700">1. Two-way check</text><text x="24.0" y="102.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Backward score by X's rank in the candidate's list</text><line x1="60.0" y1="320.0" x2="280.0" y2="320.0" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="54.0" y="324.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">0</text><line x1="60.0" y1="225.0" x2="280.0" y2="225.0" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="54.0" y="229.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">0.5</text><line x1="60.0" y1="130.0" x2="280.0" y2="130.0" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="54.0" y="134.0" font-size="10.5" fill="#52514e" text-anchor="end" 