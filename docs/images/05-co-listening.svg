<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-label="Where 'similar songs' come from. Left: three listening sessions from other people. Songs that appear together often are neighbours. Right: the resulting neighbour map around one of your songs, with closer rings meaning stronger pairing." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Where 'similar songs' come from</title><desc>Left: three listening sessions from other people. Songs that appear together often are neighbours. Right: the resulting neighbour map around one of your songs, with closer rings meaning stronger pairing.</desc><rect x="0.5" y="0.5" width="959" height="449" rx="10" fill="#fcfcfb" stroke="#d9d8d2"/><text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700">Where 'similar songs' come from</text><text x="24.0" y="54.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">No audio analysis is involved. Neighbours are songs that other listeners play in the same sitting.</text><text x="24.0" y="84.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">Step 1: other people's listening sessions</text><text x="24.0" y="133.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Session 1</text><rect x="100.0" y="108.0" width="42.0" height="36.0" rx="6" fill="#efeee9" stroke="#d9d8d2" stroke-width="1.5"/><text x="121.0" y="132.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="700">A</text><rect x="152.0" y="108.0" width="42.0" height="36.0" rx="6" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><text x="173.0" y="132.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">X</text><rect x="204.0" y="108.0" width="42.0" height="36.0" rx="6" fill="#efeee9" stroke="#d9d8d2" stroke-width="1.5"/><text x="225.0" y="132.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="700">C</text><rect x="256.0" y="108.0" width="42.0" height="36.0" rx="6" fill="#1baf7a" stroke="#ffffff" stroke-width="1.5"/><text x="277.0" y="132.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Y</text><rect x="308.0" y="108.0" width="42.0" height="36.0" rx="6" fill="#efeee9" stroke="#d9d8d2" stroke-width="1.5"/><text x="329.0" y="132.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="700">E</text><text x="24.0" y="203.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Session 2</text><rect x="100.0" y="178.0" width="42.0" height="36.0" rx="6" fill="#efeee9" stroke="#d9d8d2" stroke-width="1.5"/><text x="121.0" y="202.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="700">F</text><rect x="152.0" y="178.0" width="42.0" height="36.0" rx="6" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><text x="173.0" y="202.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">X</text><rect x="204.0" y="178.0" width="42.0" height="36.0" rx="6" fill="#1baf7a" stroke="#ffffff" stroke-width="1.5"/><text x="225.0" y="202.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Y</text><rect x="256.0" y="178.0" width="42.0" height="36.0" rx="6" fill="#efeee9" stroke="#d9d8d2" stroke-width="1.5"/><text x="277.0" y="202.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="700">G</text><rect x="308.0" y="178.0" width="42.0" height="36.0" rx="6" fill="#efeee9" stroke="#d9d8d2" stroke-width="1.5"/><text x="329.0" y="202.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="700">H</text><text x="24.0" y="273.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Session 3</text><rect x="100.0" y="248.0" width="42.0" height="36.0" rx="6" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><text x="121.0" y="272.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">X</text><rect x="152.0" y="248.0" width="42.0" height="36.0" rx="6" fill="#efeee9" stroke="#d9d8d2" stroke-width="1.5"/><text x="173.0" y="272.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="700">J</text><rect x="204.0" y="248.0" width="42.0" height="36.0" rx="6" fill="#efeee9" stroke="#d9d8d2" stroke-width="1.5"/><text x="225.0" y="272.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="700">K</text><rect x="256.0" y="248.0" width="42.0" height="36.0" rx="6" fill="#efeee9" stroke="#d9d8d2" stroke-width="1.5"/><text x="277.0" y="272.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="700">L</text><rect x="308.0" y="248.0" width="42.0" height="36.0" rx="6" fill="#efeee9" stroke="#d9d8d2" stroke-width="1.5"/><text x="329.0" y="272.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="700">M</text><rect x="100.0" y="330.0" width="14.0" height="14.0" rx="3" fill="#2a78d6"/><text x="122.0" y="342.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">X = your song</text><rect x="230.0" y="330.0" width="14.0" height="14.0" rx="3" fill="#1baf7a"/><text x="252.0" y="342.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Y = a candidate</text><text x="24.0" y="376.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">X and Y appear together in 2 of the 3 sessions.</text><text x="24.0" y="396.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Repeated over millions of sessions, this gives each song a ranked list</text><text x="24.0" y="414.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">of neighbours with a score.</text><line x1="380.0" y1="220.0" x2="462.0" y2="220.0" stroke="#52514e" stroke-width="1.8" stroke-linecap="butt"/><polygon points="470.0,220.0 462.0,224.0 462.0,216.0" fill="#52514e"/><text x="425.0" y="208.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">count pairs</text><text x="500.0" y="84.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">Step 2: the neighbour map for X</text><circle cx="730.0" cy="262.0" r="60" fill="none" stroke="#d9d8d2" stroke-width="1.2"/><text x="770.2" y="312.8" font-size="10.5" fill="#8a897f" text-anchor="start" font-weight="normal">strong</text><circle cx="730.0" cy="262.0" r="100" fill="none" stroke="#d9d8d2" stroke-width="1.2"/><text x="795.0" y="344.0" font-size="10.5" fill="#8a897f" text-anchor="start" font-weight="normal">medium</text><circle cx="730.0" cy="262.0" r="140" fill="none" stroke="#d9d8d2" stroke-width="1.2"/><text x="819.8" y="375.2" font-size="10.5" fill="#8a897f" text-anchor="start" font-weight="normal">weak</text><line x1="730.0" y1="262.0" x2="782.0" y2="232.0" stroke="#1baf7a" stroke-width="3.4" stroke-linecap="butt"/><circle cx="782.0" cy="232.0" r="15" fill="#1baf7a" stroke="#ffffff" stroke-width="1.5"/><text x="782.0" y="236.5" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">Y</text><line x1="730.0" y1="262.0" x2="719.6" y2="321.1" stroke="#52514e" stroke-width="2.6" stroke-linecap="butt"/><circle cx="719.6" cy="321.1" r="15" fill="#efeee9" stroke="#d9d8d2" stroke-width="1.5"/><text x="719.6" y="325.6" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="700">N2</text><line x1="730.0" y1="262.0" x2="636.0" y2="227.8" stroke="#52514e" stroke-width="2.0" stroke-linecap="butt"/><circle cx="636.0" cy="227.8" r="15" fill="#efeee9" stroke="#d9d8d2" stroke-width="1.5"/><text x="636.0" y="232.3" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="700">N3</text><line x1="730.0" y1="262.0" x2="643.4" y2="312.0" stroke="#52514e" stroke-width="2.0" stroke-linecap="butt"/><circle cx="643.4" cy="312.0" r="15" fill="#efeee9" stroke="#d9d8d2" stroke-width="1.5"/><text x="643.4" y="316.5" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="700">N4</text><line x1="730.0" y1="262.0" x2="780.0" y2="175.4" stroke="#52514e" stroke-width="1.6" stroke-linecap="butt"/><circle cx="780.0" cy="175.4" r="15" fill="#efeee9" stroke="#d9d8d2" stroke-width="1.5"/><text x="780.0" y="179.9" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="700">N5</text><line x1="730.0" y1="262.0" x2="867.9" y2="286.3" stroke="#52514e" stroke-width="1.2" stroke-linecap="butt"/><circle cx="867.9" cy="286.3" r="15" fill="#efeee9" stroke="#d9d8d2" stroke-width="1.5"/><text x="867.9" y="290.8" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="700">N6</text><line x1="730.0" y1="262.0" x2="670.8" y2="135.1" stroke="#52514e" stroke-width="1.0" stroke-linecap="butt"/><circle cx="670.8" cy="135.1" r="15" fill="#efeee9" stroke="#d9d8d2" stroke-width="1.5"/><text x="670.8" y="139.6" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="700">N7</text><line x1="730.0" y1="262.0" x2="664.3" y2="385.6" stroke="#52514e" stroke-width="1.0" stroke-linecap="butt"/><circle cx="664.3" cy="385.6" r="15" fill="#efeee9" stroke="#d9d8d2" stroke-width="1.5"/><text x="664.3" y="390.1" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="700">N8</text><circle cx="730.0" cy="262.0" r="22" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><text x="730.0" y="267.0" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">X</text><text x="730.0" y="440.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">Line thickness = how often the pair is played together</text></svg>
