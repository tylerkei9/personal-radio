<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="What stays on your computer and what is sent out. Your computer holds all history and the Spotify login. It sends requests to Spotify, ListenBrainz and MusicBrainz. GitHub receives the code only." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>What stays on your computer and what is sent out</title><desc>Your computer holds all history and the Spotify login. It sends requests to Spotify, ListenBrainz and MusicBrainz. GitHub receives the code only.</desc><rect x="0.5" y="0.5" width="959" height="419" rx="10" fill="#fcfcfb" stroke="#d9d8d2"/><text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700">What stays on your computer and what is sent out</text><text x="24.0" y="54.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Arrows show requests leaving your computer and the kind of data they carry.</text><rect x="330.0" y="90.0" width="300.0" height="250.0" rx="12" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="480.0" y="116.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700">Your computer</text><rect x="350.0" y="136.0" width="260.0" height="32.0" rx="6" fill="#ffffff" stroke="#d9d8d2" stroke-width="1"/><text x="480.0" y="157.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Listening history</text><rect x="350.0" y="178.0" width="260.0" height="32.0" rx="6" fill="#ffffff" stroke="#d9d8d2" stroke-width="1"/><text x="480.0" y="199.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Saved songs and recommendations</text><rect x="350.0" y="220.0" width="260.0" height="32.0" rx="6" fill="#ffffff" stroke="#d9d8d2" stroke-width="1"/><text x="480.0" y="241.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Song identity map</text><rect x="350.0" y="262.0" width="260.0" height="32.0" rx="6" fill="#ffffff" stroke="#d9d8d2" stroke-width="1"/><text x="480.0" y="283.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Spotify login token</text><text x="480.0" y="322.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">Folder: data/  (never uploaded)</text><rect x="24.0" y="90.0" width="236.0" height="90.0" rx="10" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1"/><text x="36.0" y="114.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="700">Spotify</text><text x="36.0" y="136.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Reads what you play, saves, and top lists.</text><text x="36.0" y="154.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Writes one private playlist.</text><rect x="700.0" y="90.0" width="236.0" height="90.0" rx="10" fill="#d7f1e6" stroke="#1baf7a" stroke-width="1"/><text x="712.0" y="114.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="700">ListenBrainz</text><text x="712.0" y="136.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Receives song codes only.</text><text x="712.0" y="154.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Returns songs played together.</text><rect x="700.0" y="190.0" width="236.0" height="90.0" rx="10" fill="#d7f1e6" stroke="#1baf7a" stroke-width="1"/><text x="712.0" y="214.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="700">MusicBrainz</text><text x="712.0" y="236.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Receives recording codes (ISRC).</text><text x="712.0" y="254.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Returns song and artist IDs.</text><rect x="24.0" y="240.0" width="236.0" height="80.0" rx="10" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="36.0" y="264.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="700">GitHub</text><text x="36.0" y="286.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Receives the program code.</text><text x="36.0" y="304.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Never your data or login.</text><line x1="262.0" y1="150.0" x2="318.4" y2="167.6" stroke="#2a78d6" stroke-width="1.8" stroke-linecap="butt"/><polygon points="326.0,170.0 317.2,171.4 319.6,163.8" fill="#2a78d6"/><line x1="326.0" y1="190.0" x2="269.6" y2="172.4" stroke="#2a78d6" stroke-width="1.8" stroke-linecap="butt" stroke-dasharray="4 3"/><polygon points="262.0,170.0 270.8,168.6 268.4,176.2" fill="#2a78d6"/><text x="294.0" y="146.0" font-size="10.5" fill="#2a78d6" text-anchor="middle" font-weight="600">reads</text><text x="294.0" y="210.0" font-size="10" fill="#2a78d6" text-anchor="middle" font-weight="normal">writes playlist</text><line x1="634.0" y1="150.0" x2="688.1" y2="141.3" stroke="#1baf7a" stroke-width="1.8" stroke-linecap="butt"/><polygon points="696.0,140.0 688.7,145.2 687.5,137.3" fill="#1baf7a"/><line x1="634.0" y1="240.0" x2="688.0" y2="240.0" stroke="#1baf7a" stroke-width="1.8" stroke-linecap="butt"/><polygon points="696.0,240.0 688.0,244.0 688.0,236.0" fill="#1baf7a"/><text x="665.0" y="134.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">song codes</text><text x="665.0" y="232.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">ISRC codes</text><line x1="326.0" y1="285.0" x2="272.0" y2="285.0" stroke="#8a897f" stroke-width="1.8" stroke-linecap="butt" stroke-dasharray="4 3"/><polygon points="264.0,285.0 272.0,281.0 272.0,289.0" fill="#8a897f"/><text x="295.0" y="277.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">code only</text><text x="24.0" y="380.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">The open databases receive song and artist codes, not your listening history or account details.</text><text x="24.0" y="398.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">If you set RADIO_CONTACT, that contact is included in requests to MusicBrainz, as they ask.</text></svg>
