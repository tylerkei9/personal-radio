<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="A save only counts for plays before it. Three timelines. A save within 7 days after a play upgrades that play. A save made long before a play only shows familiarity. A save made weeks after is too late." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>A save only counts for plays before it</title><desc>Three timelines. A save within 7 days after a play upgrades that play. A save made long before a play only shows familiarity. A save made weeks after is too late.</desc><rect x="0.5" y="0.5" width="959" height="429" rx="10" fill="#fcfcfb" stroke="#d9d8d2"/><text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700">A save only counts for plays that came before it</text><text x="24.0" y="54.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Why: saving a song you have loved for years says nothing about one particular play today.</text><text x="24.0" y="88.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">A. Play, then you save it 2 days later</text><line x1="206.0" y1="128.0" x2="624.0" y2="128.0" stroke="#8a897f" stroke-width="1.5" stroke-linecap="butt"/><line x1="250.0" y1="124.0" x2="250.0" y2="132.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><line x1="327.0" y1="124.0" x2="327.0" y2="132.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><line x1="404.0" y1="124.0" x2="404.0" y2="132.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><line x1="481.0" y1="124.0" x2="481.0" y2="132.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><line x1="558.0" y1="124.0" x2="558.0" y2="132.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><rect x="250.0" y="117.0" width="77.0" height="22.0" rx="4" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1" stroke-dasharray="4 3"/><text x="333.0" y="113.0" font-size="10.5" fill="#2a78d6" text-anchor="start" font-weight="normal">7 day window after the play</text><circle cx="250.0" cy="128.0" r="8" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="156.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="600">play</text><rect x="264.0" y="120.0" width="16.0" height="16.0" rx="2" fill="#eb6834" stroke="#ffffff" stroke-width="2"/><text x="272.0" y="112.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="600">save</text><text x="650.0" y="132.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Counts: the play becomes a strong like.</text><polyline points="629.0,128.0 632.5,131.5 639.0,124.5" fill="none" stroke="#2a78d6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="24.0" y="186.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">B. You saved it long before the play</text><line x1="206.0" y1="226.0" x2="624.0" y2="226.0" stroke="#8a897f" stroke-width="1.5" stroke-linecap="butt"/><line x1="250.0" y1="222.0" x2="250.0" y2="230.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><line x1="327.0" y1="222.0" x2="327.0" y2="230.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><line x1="404.0" y1="222.0" x2="404.0" y2="230.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><line x1="481.0" y1="222.0" x2="481.0" y2="230.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><line x1="558.0" y1="222.0" x2="558.0" y2="230.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><circle cx="250.0" cy="226.0" r="8" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="254.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="600">play</text><rect x="176.0" y="218.0" width="16.0" height="16.0" rx="2" fill="#eb6834" stroke="#ffffff" stroke-width="2"/><text x="184.0" y="254.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="600">save</text><text x="184.0" y="210.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">a year earlier</text><text x="650.0" y="230.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Does not count as proof. Stored as 'already familiar'.</text><line x1="629.0" y1="221.0" x2="639.0" y2="231.0" stroke="#eb6834" stroke-width="2.4" stroke-linecap="round"/><line x1="629.0" y1="231.0" x2="639.0" y2="221.0" stroke="#eb6834" stroke-width="2.4" stroke-linecap="round"/><text x="24.0" y="284.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">C. Play, then you save it 30 days later</text><line x1="206.0" y1="324.0" x2="624.0" y2="324.0" stroke="#8a897f" stroke-width="1.5" stroke-linecap="butt"/><line x1="250.0" y1="320.0" x2="250.0" y2="328.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="250.0" y="372.0" font-size="10.5" fill="#8a897f" text-anchor="middle" font-weight="normal">day 0</text><line x1="327.0" y1="320.0" x2="327.0" y2="328.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="327.0" y="372.0" font-size="10.5" fill="#8a897f" text-anchor="middle" font-weight="normal">day 7</text><line x1="404.0" y1="320.0" x2="404.0" y2="328.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="404.0" y="372.0" font-size="10.5" fill="#8a897f" text-anchor="middle" font-weight="normal">day 14</text><line x1="481.0" y1="320.0" x2="481.0" y2="328.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="481.0" y="372.0" font-size="10.5" fill="#8a897f" text-anchor="middle" font-weight="normal">day 21</text><line x1="558.0" y1="320.0" x2="558.0" y2="328.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="558.0" y="372.0" font-size="10.5" fill="#8a897f" text-anchor="middle" font-weight="normal">day 28</text><rect x="250.0" y="313.0" width="77.0" height="22.0" rx="4" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1" stroke-dasharray="4 3"/><text x="333.0" y="309.0" font-size="10.5" fill="#2a78d6" text-anchor="start" font-weight="normal">7 day window after the play</text><circle cx="250.0" cy="324.0" r="8" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="352.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="600">play</text><rect x="572.0" y="316.0" width="16.0" height="16.0" rx="2" fill="#eb6834" stroke="#ffffff" stroke-width="2"/><text x="580.0" y="308.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="600">save</text><text x="650.0" y="328.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Too late: the play stays a mild like.</text><line x1="629.0" y1="319.0" x2="639.0" y2="329.0" stroke="#eb6834" stroke-width="2.4" stroke-linecap="round"/><line x1="629.0" y1="329.0" x2="639.0" y2="319.0" stroke="#eb6834" stroke-width="2.4" stroke-linecap="round"/><circle cx="300.0" cy="408.0" r="6" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><text x="312.0" y="412.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">a play</text><rect x="380.0" y="401.0" width="13.0" height="13.0" rx="2" fill="#eb6834" stroke="#ffffff" stroke-width="1"/><text x="400.0" y="412.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">a save (added to Liked Songs)</text></svg>
