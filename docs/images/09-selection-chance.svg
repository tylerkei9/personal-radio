<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Every pick has a recorded chance of being chosen. Measured by replaying the playlist builder 3000 times: top songs are always chosen, explore band songs about a third of the time, tail songs rarely. Right: why recording the chance lets rare picks be weighted fairly." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Every pick has a recorded chance of being chosen</title><desc>Measured by replaying the playlist builder 3000 times: top songs are always chosen, explore band songs about a third of the time, tail songs rarely. Right: why recording the chance lets rare picks be weighted fairly.</desc><rect x="0.5" y="0.5" width="959" height="439" rx="10" fill="#fcfcfb" stroke="#d9d8d2"/><text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700">Every pick has a recorded chance of being chosen</text><text x="24.0" y="54.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Measured by running the real playlist builder 3000 times on 80 example songs plus 16 deep cuts.</text><line x1="70.0" y1="350.0" x2="540.0" y2="350.0" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="64.0" y="354.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">0%</text><line x1="70.0" y1="290.0" x2="540.0" y2="290.0" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="64.0" y="294.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">25%</text><line x1="70.0" y1="230.0" x2="540.0" y2="230.0" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="64.0" y="234.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">50%</text><line x1="70.0" y1="170.0" x2="540.0" y2="170.0" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="64.0" y="174.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">75%</text><line x1="70.0" y1="110.0" x2="540.0" y2="110.0" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="64.0" y="114.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">100%</text><line x1="70.0" y1="350.0" x2="70.0" y2="355.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="70.0" y="368.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">1</text><line x1="153.3" y1="350.0" x2="153.3" y2="355.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="153.3" y="368.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">15</text><line x1="260.4" y1="350.0" x2="260.4" y2="355.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="260.4" y="368.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">33</text><line x1="361.5" y1="350.0" x2="361.5" y2="355.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="361.5" y="368.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">50</text><line x1="540.0" y1="350.0" x2="540.0" y2="355.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="540.0" y="368.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">80</text><line x1="70.0" y1="350.0" x2="540.0" y2="350.0" stroke="#8a897f" stroke-width="1.2" stroke-linecap="butt"/><line x1="70.0" y1="110.0" x2="70.0" y2="350.0" stroke="#8a897f" stroke-width="1.2" stroke-linecap="butt"/><text x="305.0" y="386.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">candidate rank (1 = best score)</text><text x="70.0" y="100.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">chance of being in the playlist</text><circle cx="70.0" cy="110.0" r="3.4" fill="#2a78d6"/><circle cx="75.9" cy="110.0" r="3.4" fill="#2a78d6"/><circle cx="81.9" cy="110.0" r="3.4" fill="#2a78d6"/><circle cx="87.8" cy="110.0" r=