ont-weight="normal">deep cut (spread over the axis)</text><text x="590.0" y="96.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700">Why the chance is recorded</text><text x="590.0" y="120.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Suppose a song had a 1 in 20 chance of</text><text x="590.0" y="136.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">being picked, and you loved it.</text><rect x="590.0" y="168.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="624.0" y="168.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="658.0" y="168.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="692.0" y="168.0" width="28.0" height="28.0" rx="5" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/><rect x="726.0" y="168.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="760.0" y="168.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="794.0" y="168.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="828.0" y="168.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="862.0" y="168.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="896.0" y="168.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="590.0" y="202.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="624.0" y="202.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="658.0" y="202.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="692.0" y="202.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="726.0" y="202.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="760.0" y="202.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="794.0" y="202.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="828.0" y="202.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="862.0" y="202.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="896.0" y="202.0" width="28.0" height="28.0" rx="5" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5" stroke-dasharray="3 3"/><text x="590.0" y="252.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">The one shown stands in for roughly 20 similar</text><text x="590.0" y="269.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">songs that could have been shown but were not.</text><text x="590.0" y="286.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Counting it 20 times (1 divided by its chance)</text><text x="590.0" y="303.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">corrects for the picks you never saw.</text><rect x="590.0" y="330.0" width="340.0" height="70.0" rx="8" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="604.0" y="354.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">Without the recorded chance, the confident</text><text x="604.0" y="371.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">picks would always look better than they are.</text></svg>
