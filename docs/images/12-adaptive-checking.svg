<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Checking less often when nothing is playing. Seconds between checks as idle time grows. Idle checks slow from every 10 seconds to every minute and then every 2 minutes. About 752 checks a day instead of 8640." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Checking less often when nothing is playing</title><desc>Seconds between checks as idle time grows. Idle checks slow from every 10 seconds to every minute and then every 2 minutes. About 752 checks a day instead of 8640.</desc><rect x="0.5" y="0.5" width="959" height="439" rx="10" fill="#fcfcfb" stroke="#d9d8d2"/><text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700">Checking less often when nothing is playing</text><text x="24.0" y="54.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">A late check loses nothing: start times come from the song's own progress. Short plays are recovered hourly.</text><line x1="80.0" y1="340.0" x2="600.0" y2="340.0" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="74.0" y="344.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">0</text><line x1="80.0" y1="289.2" x2="600.0" y2="289.2" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="74.0" y="293.2" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">30</text><line x1="80.0" y1="238.5" x2="600.0" y2="238.5" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="74.0" y="242.5" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">60</text><line x1="80.0" y1="187.7" x2="600.0" y2="187.7" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="74.0" y="191.7" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">90</text><line x1="80.0" y1="136.9" x2="600.0" y2="136.9" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="74.0" y="140.9" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">120</text><line x1="80.0" y1="340.0" x2="80.0" y2="345.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="80.0" y="358.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">0</text><line x1="166.7" y1="340.0" x2="166.7" y2="345.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="166.7" y="358.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">20</text><line x1="253.3" y1="340.0" x2="253.3" y2="345.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="253.3" y="358.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">40</text><line x1="340.0" y1="340.0" x2="340.0" y2="345.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="340.0" y="358.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">60</text><line x1="426.7" y1="340.0" x2="426.7" y2="345.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="426.7" y="358.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">80</text><line x1="513.3" y1="340.0" x2="513.3" y2="345.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="513.3" y="358.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">100</text><line x1="600.0" y1="340.0" x2="600.0" y2="345.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="600.0" y="358.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">120</text><line x1="80.0" y1="340.0" x2="600.0" y2="340.0" stroke="#8a897f" stroke-width="1.2" stroke-linecap="butt"/><line x1="80.0" y1="120.0" x2="80.0" y2="340.0" stroke="#8a897f" stroke-width="1.2" stroke-linecap="butt"/><text x="340.0" y="376.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">minutes since playback stopped</text><text 