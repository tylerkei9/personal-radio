<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="The whole system in five steps. Spotify plays flow through watch, learn, find, choose into a weekly playlist, and what you play next week feeds back in." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The whole system in five steps</title><desc>Spotify plays flow through watch, learn, find, choose into a weekly playlist, and what you play next week feeds back in.</desc><rect x="0.5" y="0.5" width="959" height="399" rx="10" fill="#fcfcfb" stroke="#d9d8d2"/><text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700">The whole system in five steps</text><text x="24.0" y="54.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Each step hands a simple result to the next. The loop closes when you listen to the playlist.</text><rect x="15.0" y="130.0" width="130.0" height="110.0" rx="10" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="80.0" y="162.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700">1 Watch</text><text x="80.0" y="190.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Record each play</text><text x="80.0" y="208.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">what, when, how long</text><rect x="215.0" y="130.0" width="130.0" height="110.0" rx="10" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="280.0" y="162.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700">2 Learn</text><text x="280.0" y="190.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Grade each play</text><text x="280.0" y="208.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">like, dislike, unclear</text><rect x="415.0" y="130.0" width="130.0" height="110.0" rx="10" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="480.0" y="162.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700">3 Find</text><text x="480.0" y="190.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Look up neighbours</text><text x="480.0" y="208.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">songs listeners pair</text><rect x="615.0" y="130.0" width="130.0" height="110.0" rx="10" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="680.0" y="162.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700">4 Choose</text><text x="680.0" y="190.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Pick 30 songs</text><text x="680.0" y="208.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">mix of safe and random</text><rect x="815.0" y="130.0" width="130.0" height="110.0" rx="10" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="880.0" y="162.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700">5 Publish</text><text x="880.0" y="190.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Write the playlist</text><text x="880.0" y="208.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">private, in Spotify</text><line x1="149.0" y1="185.0" x2="203.0" y2="185.0" stroke="#52514e" stroke-width="1.8" stroke-linecap="butt"/><polygon points="211.0,185.0 203.0,189.0 203.0,181.0" fill="#52514e"/><text x="180.0" y="168.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">plays</text><line x1="349.0" y1="185.0" x2="403.0" y2="185.0" stroke="#52514e" stroke-width="1.8" stroke-linecap="butt"/><polygon points="411.0,185.0 403.0,189.0 403.0,181.0" fill="#52514e"/><text x="380.0" y="156.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">likes and</text><text x="380.0" y="168.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">dislikes</text><line x1="549.0" y1="185.0" x2="603.0" y2="185.0" stroke="#52514e" stroke-width="1.8" stroke-linecap="butt"/><polygon points="611.0,185.0 603.0,189.0 603.0,181.0" fill="#52514e"/><text x="580.0" y="156.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">candidate</text><text x="580.0" y="168.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">songs</text><line x1="749.0" y1="185.0" x2="803.0" y2="185.0" stroke="#52514e" stroke-width="1.8" stroke-linecap="butt"/><polygon points="811.0,185.0 803.0,189.0 803.0,181.0" fill="#52514e"/><text x="780.0" y="168.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">30 songs</text><rect x="15.0" y="66.0" width="130.0" height="40.0" rx="8" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1"/><text x="80.0" y="90.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">Spotify account</text><line x1="80.0" y1="108.0" x2="80.0" y2="120.0" stroke="#2a78d6" stroke-width="1.8" stroke-linecap="butt"/><polygon points="80.0,128.0 76.0,120.0 84.0,120.0" fill="#2a78d6"/><rect x="400.0" y="66.0" width="160.0" height="40.0" rx="8" fill="#d7f1e6" stroke="#1baf7a" stroke-width="1"/><text x="480.0" y="90.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">Open music databases</text><line x1="480.0" y1="108.0" x2="480.0" y2="120.0" stroke="#1baf7a" stroke-width="1.8" stroke-linecap="butt"/><polygon points="480.0,128.0 476.0,120.0 484.0,120.0" fill="#1baf7a"/><rect x="815.0" y="66.0" width="130.0" height="40.0" rx="8" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1"/><text x="880.0" y="90.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">Spotify account</text><line x1="880.0" y1="128.0" x2="880.0" y2="116.0" stroke="#2a78d6" stroke-width="1.8" stroke-linecap="butt"/><polygon points="880.0,108.0 884.0,116.0 876.0,116.0" fill="#2a78d6"/><polyline points="880.0,244.0 880.0,300.0 80.0,300.0 80.0,250.0" fill="none" stroke="#8a897f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><line x1="80.0" y1="270.0" x2="80.0" y2="252.0" stroke="#8a897f" stroke-width="1.8" stroke-linecap="butt"/><polygon points="80.0,244.0 84.0,252.0 76.0,252.0" fill="#8a897f"/><text x="480.0" y="322.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="normal">Feedback loop: what you play from the playlist becomes next week's data</text><text x="480.0" y="352.0" font-size="12" fill="#8a897f" text-anchor="middle" font-weight="normal">Steps 1 and 2 run all day. Steps 3 to 5 run when you ask for a playlist (once a week is enough).</text></svg>
