<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Scoring a ranked list: why position matters. Two ranked lists of 10 songs each contain the same 2 liked songs. List A has them at positions 1 and 4, list B at positions 7 and 9. A bar chart shows the weight of each position and the resulting scores." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Scoring a ranked list: why position matters</title><desc>Two ranked lists of 10 songs each contain the same 2 liked songs. List A has them at positions 1 and 4, list B at positions 7 and 9. A bar chart shows the weight of each position and the resulting scores.</desc><rect x="0.5" y="0.5" width="959" height="439" rx="10" fill="#fcfcfb" stroke="#d9d8d2"/><text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700">Scoring a ranked list: why position matters</text><text x="24.0" y="54.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">NDCG@10 gives more credit to a hit near the top. Both lists below contain the same two liked songs.</text><line x1="70.0" y1="300.0" x2="470.0" y2="300.0" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="64.0" y="304.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">0</text><line x1="70.0" y1="209.5" x2="470.0" y2="209.5" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="64.0" y="213.5" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">0.5</text><line x1="70.0" y1="119.0" x2="470.0" y2="119.0" stroke="#e6e5df" stroke-width="1" stroke-linecap="butt"/><text x="64.0" y="123.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="normal">1</text><line x1="90.0" y1="300.0" x2="90.0" y2="305.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="90.0" y="318.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">1</text><line x1="130.0" y1="300.0" x2="130.0" y2="305.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="130.0" y="318.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">2</text><line x1="170.0" y1="300.0" x2="170.0" y2="305.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="170.0" y="318.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">3</text><line x1="210.0" y1="300.0" x2="210.0" y2="305.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="210.0" y="318.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">4</text><line x1="250.0" y1="300.0" x2="250.0" y2="305.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="250.0" y="318.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">5</text><line x1="290.0" y1="300.0" x2="290.0" y2="305.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="290.0" y="318.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">6</text><line x1="330.0" y1="300.0" x2="330.0" y2="305.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="330.0" y="318.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">7</text><line x1="370.0" y1="300.0" x2="370.0" y2="305.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="370.0" y="318.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">8</text><line x1="410.0" y1="300.0" x2="410.0" y2="305.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="410.0" y="318.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">9</text><line x1="450.0" y1="300.0" x2="450.0" y2="305.0" stroke="#8a897f" stroke-width="1" stroke-linecap="butt"/><text x="450.0" y="318.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">10</text><line x1="70.0" y1="300.0" x2="470.0" y2="300.0" stroke="#8a897f" stroke-width="1.2" stroke-linecap="butt"/><line x1="70.0" y1="110.0" x2="70.0" y2="300.0" stroke="#8a897f" stroke-width="1.2" stroke-linecap="butt"/><text x="270.0" y="336.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">position in the list</text><text x="70.0" y="100.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">credit for a hit at that position</text><rect x="76.0" y="119.0" width="28.0" height="181.0" rx="3" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="90.0" y="114.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">1.00</text><rect x="116.0" y="185.8" width="28.0" height="114.2" rx="3" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="130.0" y="180.8" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">0.63</text><rect x="156.0" y="209.5" width="28.0" height="90.5" rx="3" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="170.0" y="204.5" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">0.50</text><rect x="196.0" y="222.1" width="28.0" height="77.9" rx="3" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="210.0" y="217.1" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">0.43</text><rect x="236.0" y="230.0" width="28.0" height="70.0" rx="3" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="250.0" y="225.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">0.39</text><rect x="276.0" y="235.5" width="28.0" height="64.5" rx="3" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="290.0" y="230.5" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">0.36</text><rect x="316.0" y="239.7" width="28.0" height="60.3" rx="3" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="330.0" y="234.7" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">0.33</text><rect x="356.0" y="242.9" width="28.0" height="57.1" rx="3" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="370.0" y="237.9" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">0.32</text><rect x="396.0" y="245.5" width="28.0" height="54.5" rx="3" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="410.0" y="240.5" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">0.30</text><rect x="436.0" y="247.7" width="28.0" height="52.3" rx="3" fill="#efeee9" stroke="#d9d8d2" stroke-width="1"/><text x="450.0" y="242.7" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">0.29</text><circle cx="84.0" cy="288.0" r="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/><circle cx="204.0" cy="288.0" r="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/><rect x="331.0" y="282.0" width="12.0" height="12.0" rx="2" fill="#eb6834" stroke="#eb6834" stroke-width="1.5"/><rect x="411.0" y="282.0" width="12.0" height="12.0" rx="2" fill="#eb6834" stroke="#eb6834" stroke-width="1.5"/><circle cx="120.0" cy="372.0" r="6" fill="#2a78d6"/><text x="132.0" y="376.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">liked song in list A</text><rect x="270.0" y="366.0" width="12.0" height="12.0" rx="2" fill="#eb6834"/><text x="288.0" y="376.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">liked song in list B</text><text x="520.0" y="112.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700">Scores (best possible = 1.00)</text><text x="520.0" y="154.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="700">List A</text><text x="580.0" y="154.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">hits at positions 1 and 4</text><rect x="520.0" y="168.0" width="380.0" height="22.0" rx="4" fill="#ffffff" stroke="#d9d8d2" stroke-width="1"/><rect x="520.0" y="168.0" width="333.3" height="22.0" rx="4" fill="#2a78d6"/><text x="845.3" y="185.0" font-size="13" fill="#ffffff" text-anchor="end" font-weight="700">0.88</text><text x="520.0" y="244.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="700">List B</text><text x="580.0" y="244.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">hits at positions 7 and 9</text><rect x="520.0" y="258.0" width="380.0" height="22.0" rx="4" fill="#ffffff" stroke="#d9d8d2" stroke-width="1"/><rect x="520.0" y="258.0" width="147.8" height="22.0" rx="4" fill="#eb6834"/><text x="675.8" y="275.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="700">0.39</text><text x="520.0" y="335.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Best case for two liked songs: positions 1 and 2.</text><text x="520.0" y="352.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Credit at position i is 1 / log2(i + 1), then divided by that best case.</text><text x="520.0" y="385.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Why it matters: a playlist is read from the top, so late hits are worth less.</text></svg>
